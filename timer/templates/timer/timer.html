{% extends "base.html" %}
{% block title %}Timer - Evap{% endblock %}

{% block extrahead %}
<link rel="stylesheet" href="/static/css/timer-clock.css">
{% endblock %}

{% block content %}

<div class="flex-1 flex items-center justify-center">
<div class="timer-desk">

<div class="timer-face w-full max-w-[540px] fade-in">

  <!-- MODE -->
  <div class="timer-mode-tabs">
    <button id="btnStopwatch" class="btn" onclick="setMode('stopwatch')">Chrono</button>
    <button id="btnCountdown" class="btn" onclick="setMode('countdown')">Minuteur</button>
  </div>

  <!-- RING + DISPLAY -->
  <div class="timer-ring-face">
    <span class="clock-mark mark-12">12</span>
    <span class="clock-mark mark-3">3</span>
    <span class="clock-mark mark-6">6</span>
    <span class="clock-mark mark-9">9</span>
    <div class="clock-hand hour-hand"></div>
    <div class="clock-hand minute-hand"></div>
    <div class="clock-center"></div>
    <div id="display" class="timer-display">00:00:00</div>
  </div>

  <!-- INPUT -->
  <div id="countdownSetup" class="hidden mb-6">
    <div class="flex gap-2 justify-center">
      <input id="minutesInput" type="number" min="0" placeholder="min" class="input timer-input w-24 text-center">
      <input id="secondsInput" type="number" min="0" max="59" placeholder="sec" class="input timer-input w-24 text-center">
    </div>
    <div class="timer-presets">
      <button type="button" onclick="startPreset(25)">25 min · Focus</button>
      <button type="button" onclick="startPreset(5)">5 min · Pause</button>
      <button type="button" onclick="startPreset(15)">15 min · Grande pause</button>
    </div>
  </div>

  <!-- CONTROLS -->
  <div class="timer-controls flex justify-center gap-3">
    <button id="btnStart" class="btn btn-primary" onclick="handleStart()">Start</button>
    <button id="btnPause" class="btn btn-ghost" onclick="handlePause()">Pause</button>
    <button id="btnReset" class="btn btn-ghost" onclick="handleReset()">Reset</button>
  </div>

</div>

</div>
</div>

{% endblock %}

{% block extrascripts %}
<script>

let mode = "stopwatch";

/* MODE UI */
function setActiveModeButtons(){
  document.getElementById("btnStopwatch").classList.toggle("btn-active", mode === "stopwatch");
  document.getElementById("btnCountdown").classList.toggle("btn-active", mode === "countdown");
}

/* CONTROL UI */
function setControlState(activeId){
  ["btnStart","btnPause","btnReset"].forEach(id => {
    document.getElementById(id).classList.remove("active-control");
  });
  if(activeId){
    document.getElementById(activeId).classList.add("active-control");
  }
}

/* MODE */
function setMode(m){
  EvapTimer.setMode(m);
  mode = m;

  document.getElementById("countdownSetup").style.display =
    m === "countdown" ? "block" : "none";

  setActiveModeButtons();
  setControlState(null);
}

function handleStart(){
  let seconds;
  if(mode === "countdown"){
    const min = parseInt(document.getElementById("minutesInput").value || 0);
    const sec = parseInt(document.getElementById("secondsInput").value || 0);
    seconds = min * 60 + sec;
  }
  EvapTimer.start(seconds);
  setControlState("btnStart");
}

function startPreset(minutes){
  mode = "countdown";
  document.getElementById("minutesInput").value = minutes;
  document.getElementById("secondsInput").value = 0;
  document.getElementById("countdownSetup").style.display = "block";
  setActiveModeButtons();
  handleStart();
}

function handlePause(){
  EvapTimer.pause();
  setControlState("btnPause");
}

function handleReset(){
  EvapTimer.reset();
  setControlState("btnReset");
}

/* DISPLAY (driven by the shared EvapTimer loop) */
function renderTime(ms){
  document.getElementById("display").innerText = EvapTimer.format(ms);
}

/* INIT - reflect whatever state the persistent timer already has
   (e.g. a countdown started on another page keeps running here).
   EvapTimer is already initialized at this point (see base.html). */
mode = EvapTimer.mode;

document.getElementById("countdownSetup").style.display =
  mode === "countdown" ? "block" : "none";

setActiveModeButtons();
setControlState(EvapTimer.running ? "btnStart" : null);

EvapTimer.subscribe(renderTime);

</script>
{% endblock %}
