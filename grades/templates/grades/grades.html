{% extends "base.html" %}
{% block title %}Calculateur - Evap{% endblock %}

{% block extrahead %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link rel="stylesheet" href="/static/css/grades-bulletin.css">
<style>
canvas { max-height: 200px; }
</style>
{% endblock %}

{% block content %}

<div class="report-head-frame">
  <div class="report-ribbon"><span>Bulletin scolaire</span></div>

  <div class="report-head">
    <h1>Calculateur de notes</h1>
    <button onclick="createTable()" class="brass-button">
      {% include "partials/icon.html" with name="plus" cls="w-4 h-4" %}
      Nouveau tableau
    </button>
  </div>
</div>

<div id="tables-container" class="grid grid-cols-1 xl:grid-cols-2 gap-6"></div>

{% endblock %}

{% block extrascripts %}
<script>

/* SVG icons for JS-rendered content (mirrors templates/partials/icon.html) */
const ICON_TRASH = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4"><path d="M5 7h14M9.5 7V5a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v2m-8.5 0 .8 12a2 2 0 0 0 2 1.9h5.4a2 2 0 0 0 2-1.9L18.5 7"/><path d="M10 11v6M14 11v6"/></svg>';
const ICON_X = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4"><path d="M6 6l12 12M18 6 6 18"/></svg>';
const ICON_PLUS = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="w-3.5 h-3.5"><path d="M12 5v14M5 12h14"/></svg>';
const ICON_TROPHY = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="w-3.5 h-3.5"><path d="M7 4h10v4a5 5 0 0 1-10 0V4Z"/><path d="M7 5H4v2a3 3 0 0 0 3 3M17 5h3v2a3 3 0 0 1-3 3"/><path d="M12 13v3m-3 4h6m-3-4v4"/></svg>';

/* Un <canvas> ne comprend pas var(--...) : on résout la couleur réelle en
   posant la variable sur un élément DOM invisible puis en relisant sa
   valeur calculée (répond à --brand-h, donc au sélecteur de couleur). */
function themeColor(cssVar) {
    const probe = document.createElement('span');
    probe.style.background = `var(${cssVar})`;
    document.body.appendChild(probe);
    const resolved = getComputedStyle(probe).backgroundColor;
    probe.remove();
    return resolved;
}

/* ================= API ================= */
/* Le token vient directement du contexte Django (comme sur les autres pages) :
   contrairement à une lecture du cookie csrftoken, ça marche même si /grades/
   est la toute première page visitée dans la session. */

async function post(url, body={}) {
    return fetch(url, {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": "{{ csrf_token }}"
        },
        body: JSON.stringify(body)
    }).then(r => r.json());
}

/* ================= STATE ================= */

let state = { tables: [] };

/* ================= INIT ================= */

async function init() {
    const res = await fetch("/grades/get_tables/");
    const data = await res.json();

    state.tables = data.tables;
    render();
}

/* ================= DEBOUNCE ================= */

let timers = {};

function debounce(key, fn) {
    clearTimeout(timers[key]);
    timers[key] = setTimeout(fn, 200);
}

/* ================= LIVE UPDATE ================= */

function updateTableName(id, value) {
    const t = state.tables.find(x => x.id == id);
    if (t) t.name = value;

    debounce("t"+id, () =>
        post(`/grades/update_table/${id}/`, { name: value })
    );

    calculateAll();
}

function updateSubject(tableId, subjectId, field, value) {
    const t = state.tables.find(x => x.id == tableId);
    const s = t?.subjects.find(x => x.id == subjectId);
    if (!s) return;

    if (field === "name") s.name = value;
    if (field === "coeff") s.coeff = Number(value);

    debounce("s"+subjectId, () =>
        post(`/grades/update_subject/${subjectId}/`, {
            name: s.name,
            coeff: s.coeff
        })
    );

    calculateAll();
}

function updateGrade(tableId, subjectId, gradeId, field, value) {
    const t = state.tables.find(x => x.id == tableId);
    const s = t?.subjects.find(x => x.id == subjectId);
    const g = s?.grades.find(x => x.id == gradeId);
    if (!g) return;

    if (field === "name") g.name = value;
    if (field === "value") g.value = Number(value);
    if (field === "coeff") g.coeff = Number(value);

    debounce("g"+gradeId, () =>
        post(`/grades/update_grade/${gradeId}/`, {
            name: g.name,
            value: g.value,
            coeff: g.coeff
        })
    );

    calculateAll();
}

/* ================= CRUD ================= */

async function createTable() {
    const res = await post("/grades/create_table/");
    state.tables.push({ id: res.id, name: res.name, subjects: [] });
    render();
}

async function deleteTable(id) {
    await post(`/grades/delete_table/${id}/`);
    state.tables = state.tables.filter(t => t.id != id);
    render();
}

async function deleteSubject(id) {
    await post(`/grades/delete_subject/${id}/`);
    state.tables.forEach(t =>
        t.subjects = t.subjects.filter(s => s.id != id)
    );
    render();
}

async function deleteGrade(id) {
    await post(`/grades/delete_grade/${id}/`);
    state.tables.forEach(t =>
        t.subjects.forEach(s =>
            s.grades = s.grades.filter(g => g.id != id)
        )
    );
    render();
}

async function addSubject(tableId) {
    const res = await post(`/grades/add_subject/${tableId}/`);
    const t = state.tables.find(x => x.id == tableId);

    t.subjects.push({
        id: res.id,
        name: res.name,
        coeff: res.coefficient,
        grades: []
    });

    render();
}

async function addGrade(subjectId) {
    const res = await post(`/grades/add_grade/${subjectId}/`);

    state.tables.forEach(t => {
        const s = t.subjects.find(x => x.id == subjectId);
        if (s) s.grades.push({
            id: res.id,
            name: "",
            value: 0,
            coeff: 1
        });
    });

    render();
}

/* ================= CALCUL ================= */

function calculateAll() {
    document.querySelectorAll(".table-card").forEach(table => {

        let total = 0;
        let totalCoeff = 0;
        let labels = [];
        let values = [];

        table.querySelectorAll(".subject").forEach(subject => {

            let sTotal = 0;
            let sCoeff = 0;

            subject.querySelectorAll(".grade").forEach(g => {
                const v = parseFloat(g.querySelector(".grade-value").value) || 0;
                const c = parseFloat(g.querySelector(".grade-coeff").value) || 0;
                sTotal += v * c;
                sCoeff += c;
            });

            const avg = sCoeff ? sTotal / sCoeff : 0;

            subject.querySelector(".subject-average").innerText = avg.toFixed(2);

            const impactBar = subject.querySelector(".subject-impact-bar > span");
            if (impactBar) impactBar.style.width = Math.max(0, Math.min(100, avg / 20 * 100)) + "%";

            const coeff = Number(subject.querySelector(".subject-coeff")?.value || 1);

            total += avg * coeff;
            totalCoeff += coeff;

            labels.push(subject.querySelector(".subject-name").value || "Matière");
            values.push(avg);
        });

        const global = totalCoeff ? total / totalCoeff : 0;
        table.querySelector(".global-average").innerText = global.toFixed(2);

        const ctx = table.querySelector(".chart");

        if (table.chartInstance) table.chartInstance.destroy();

        table.chartInstance = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels,
                datasets: [{
                    data: values,
                    backgroundColor: ['--c-ec4899','--c-f472b6','--c-f9a8d4','--c-db2777','--c-fbcfe8'].map(themeColor)
                }]
            },
            options: {
                plugins: { legend: { labels: { font: { family: "Poppins" } } } }
            }
        });
    });
}

/* ================= RENDER ================= */

function render() {
    const container = document.getElementById("tables-container");
    container.innerHTML = "";

    if (state.tables.length === 0) {
        const ICON_GRADES = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="w-7 h-7 text-rose"><path d="M3.5 20h17"/><rect x="5.5" y="12" width="3" height="7"/><rect x="10.5" y="7.5" width="3" height="11.5"/><rect x="15.5" y="4" width="3" height="15"/></svg>';
        container.innerHTML = `
        <div class="col-span-full empty-state card">
            <div class="empty-state-icon">${ICON_GRADES}</div>
            <p>Aucun tableau pour l'instant — clique sur "Nouveau tableau" pour commencer.</p>
        </div>`;
        return;
    }

    state.tables.forEach(t => {

        const div = document.createElement("div");
        div.className = "card bulletin-sheet table-card fade-in";

        div.innerHTML = `
        <div class="bulletin-header flex justify-between items-start gap-3 mb-1">

            <div class="flex-1 min-w-0">
                <div class="bulletin-kicker">${ICON_TROPHY} Le point sur mes notes</div>
                <input class="bulletin-title-input w-full"
                    value="${t.name}"
                    oninput="updateTableName(${t.id}, this.value)">
            </div>

            <div class="bulletin-average shrink-0">
                <span class="global-average">0</span>
                <span class="bulletin-average-label">/ 20</span>
            </div>

        </div>

        <div class="bulletin-header flex gap-2 mb-4">
            <button onclick="addSubject(${t.id})" class="btn btn-primary !px-3 !py-1.5 text-xs">${ICON_PLUS} matière</button>
            <button onclick="deleteTable(${t.id})" class="icon-btn icon-btn-danger !w-8 !h-8 !min-w-0 !min-h-0" aria-label="Supprimer le tableau">${ICON_TRASH}</button>
        </div>

        <div>

        ${t.subjects.map(s => `
            <div class="subject bulletin-subject">

                <div class="flex gap-2 mb-2 items-center">

                    <i class="subject-dot"></i>

                    <input class="subject-name input !py-1.5 flex-1"
                        value="${s.name}"
                        placeholder="Nom de la matière"
                        oninput="updateSubject(${t.id}, ${s.id}, 'name', this.value)">

                    <input class="subject-coeff input !py-1.5 w-16 text-center"
                        value="${s.coeff}"
                        title="Coefficient"
                        oninput="updateSubject(${t.id}, ${s.id}, 'coeff', this.value)">

                    <button class="icon-btn icon-btn-danger !w-8 !h-8 !min-w-0 !min-h-0" aria-label="Supprimer la matière" onclick="deleteSubject(${s.id})">${ICON_TRASH}</button>

                </div>

                <div class="subject-impact-bar"><span></span></div>

                ${s.grades.map(g => `
                    <div class="grade bulletin-grade-row flex gap-2 mb-1.5">

                        <input class="input !py-1.5 flex-1"
                            value="${g.name}"
                            placeholder="Note"
                            oninput="updateGrade(${t.id}, ${s.id}, ${g.id}, 'name', this.value)">

                        <input class="grade-value input !py-1.5 w-16 text-center"
                            value="${g.value}"
                            title="Valeur"
                            oninput="updateGrade(${t.id}, ${s.id}, ${g.id}, 'value', this.value)">

                        <input class="grade-coeff input !py-1.5 w-16 text-center"
                            value="${g.coeff}"
                            title="Coefficient"
                            oninput="updateGrade(${t.id}, ${s.id}, ${g.id}, 'coeff', this.value)">

                        <button class="icon-btn icon-btn-danger !w-8 !h-8 !min-w-0 !min-h-0" aria-label="Supprimer la note" onclick="deleteGrade(${g.id})">${ICON_X}</button>

                    </div>
                `).join("")}

                <button onclick="addGrade(${s.id})" class="flex items-center gap-1.5 text-sm text-darkrose mt-1 hover:underline">
                    ${ICON_PLUS} note
                </button>

                <div class="text-xs mt-2 text-muted">
                    Moyenne : <span class="subject-average font-semibold text-ink">0</span>
                </div>

            </div>
        `).join("")}

        </div>

        <canvas class="chart mt-4"></canvas>
        `;

        container.appendChild(div);
    });

    calculateAll();
}

init();

</script>
{% endblock %}
